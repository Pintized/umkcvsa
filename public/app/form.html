<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMKC VSA Form</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script src="/app/shared/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/shared/app.css">
<style>
  .auth-card { max-width: 560px; }
  .form-desc { color: var(--muted); font-size: .92rem; line-height: 1.5; margin-bottom: 18px; white-space: pre-wrap; }
  .fq { margin-bottom: 18px; }
  .fq > label.q-label { display: block; font-weight: 600; margin-bottom: 7px; }
  .fq .req { color: var(--ink-red); }
  .opt-row { display: flex; gap: 9px; align-items: center; padding: 4px 0; cursor: pointer; font-size: .94rem; }
  .opt-row input { width: 16px; height: 16px; cursor: pointer; flex: none; }
  .q-desc { color: var(--muted); font-size: .82rem; margin: -3px 0 8px; white-space: pre-wrap; }
  .f-sec { border-top: 2px solid var(--gold, #c99b3f); margin: 24px 0 14px; padding-top: 12px; }
  .f-sec h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .scale-row { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
  .scale-row .end { color: var(--muted); font-size: .8rem; padding: 0 6px 6px; }
  .scale-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 5px; cursor: pointer; font-size: .84rem; }
  .scale-cell input { width: 16px; height: 16px; cursor: pointer; }
  .other-in { flex: 1; min-width: 120px; }
  .thanks { text-align: center; padding: 20px 0; }
  .thanks .big { font-size: 3rem; animation: pop .5s cubic-bezier(.2, .9, .3, 1.4); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="https://umkcvsa.org">
      <img src="/assets/img/logo-128.png" alt="UMKC VSA logo">
      <span>UMKC VSA</span>
    </a>
    <div id="form-body"><p style="color:var(--muted)">Loading form…</p></div>
  </div>
</div>
<script type="module">
  import { supabase } from '/app/shared/supabase.js';

  const body = document.getElementById('form-body');
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  // labels/descriptions may carry officer formatting — allow only
  // b/strong/i/em/u/br and http(s) links (forced into new tabs),
  // everything else is flattened. Defense in depth: stored values are
  // sanitized at save too, but never trust stored HTML blindly.
  const RICH_ALLOW = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'A']);
  function rich(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html ?? '');
    const walk = (node) => [...node.childNodes].map((n) => {
      if (n.nodeType === 3) return esc(n.nodeValue);
      if (n.nodeType !== 1) return '';
      const inner = walk(n);
      if (n.tagName === 'BR') return '<br>';
      if (n.tagName === 'A') {
        const href = n.getAttribute('href') || '';
        return /^https?:\/\//i.test(href)
          ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
          : inner;
      }
      if (RICH_ALLOW.has(n.tagName)) {
        const t = n.tagName.toLowerCase();
        return `<${t}>${inner}</${t}>`;
      }
      return inner + (/^(DIV|P|LI|H[1-6])$/.test(n.tagName) ? '<br>' : '');
    }).join('');
    return walk(tmp).replace(/(<br>)+$/, '').trim();
  }
  const plain = (html) => {
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html ?? '');
    return tmp.textContent.trim();
  };
  const id = new URLSearchParams(location.search).get('id');

  const dead = (title, msg) => {
    body.innerHTML = `<h1>${title}</h1><p class="sub">${msg}</p>`;
  };

  const isPreview = new URLSearchParams(location.search).has('preview');

  if (!id && !isPreview) { dead('Hmm…', 'This form link is missing its ID — double-check the URL you were sent.'); }
  else {
    let form = null, error = null, signedIn = false;
    if (isPreview) {
      // draft handed over by the builder tab (same origin) — never saved
      try { form = JSON.parse(localStorage.getItem('vsa-form-preview') || 'null'); } catch { form = null; }
      if (form) {
        form.accepting = true;
        document.body.insertAdjacentHTML('afterbegin', `
          <div style="position:sticky; top:0; z-index:50; text-align:center; font-size:.85rem; font-weight:600;
              padding:8px 14px; background:rgba(224,180,92,.14); border-bottom:1px solid rgba(224,180,92,.4); color:var(--ink-gold)">
            👁️ Preview — this is what people will see. Responses are not recorded.</div>`);
      }
    } else {
      const [f, sess] = await Promise.all([
        supabase.rpc('get_form', { form: id }),
        supabase.auth.getSession(),
      ]);
      form = f.data; error = f.error;
      signedIn = !!sess.data?.session;
    }

    const closedByDate = !isPreview && form?.settings?.close_at && Date.now() > new Date(form.settings.close_at).getTime();

    if (error || !form) {
      if (isPreview) { dead('Nothing to preview', 'Go back to the form builder and press Preview again.'); } else
      dead('Form not found', 'This link doesn\'t match any form — it may have been deleted, or the URL is incomplete.');
    } else if (!form.accepting || closedByDate) {
      dead(esc(form.title), 'This form is no longer accepting responses. 🙏');
    } else if (form.settings?.limit_one && !signedIn && !isPreview) {
      dead(esc(form.title), `This form is limited to one response per member, so you need to be
        signed in. <a href="/app/login" style="color:var(--gold, #c99b3f)">Log in</a> and then reopen this link.`);
    } else {
      const qs = form.questions || [];
      const qHtml = (q) => {
        const req = q.required ? ' <span class="req">*</span>' : '';
        const desc = q.desc ? `<div class="q-desc">${rich(q.desc)}</div>` : '';
        const label = `<label class="q-label">${rich(q.label)}${req}</label>${desc}`;
        if (q.type === 'section') return `<div class="f-sec"><h2>${rich(q.label)}</h2>${q.desc ? `<div class="q-desc">${rich(q.desc)}</div>` : ''}</div>`;
        if (q.type === 'short') return `<div class="fq" data-q="${q.id}">${label}<div class="field" style="margin:0"><input data-in="${q.id}"></div></div>`;
        if (q.type === 'para') return `<div class="fq" data-q="${q.id}">${label}<div class="field" style="margin:0"><textarea data-in="${q.id}" rows="3"></textarea></div></div>`;
        if (q.type === 'date') return `<div class="fq" data-q="${q.id}">${label}<div class="field" style="margin:0"><input type="date" data-in="${q.id}"></div></div>`;
        if (q.type === 'time') return `<div class="fq" data-q="${q.id}">${label}<div class="field" style="margin:0"><input type="time" data-in="${q.id}"></div></div>`;
        if (q.type === 'drop') return `<div class="fq" data-q="${q.id}">${label}<div class="field" style="margin:0"><select data-in="${q.id}"><option value="">— pick one —</option>${(q.options || []).map(o => `<option>${esc(o)}</option>`).join('')}</select></div></div>`;
        if (q.type === 'scale') {
          const min = q.min ?? 1, max = q.max ?? 5;
          const cells = [];
          for (let n = min; n <= max; n++) {
            cells.push(`<label class="scale-cell"><span>${n}</span><input type="radio" name="${q.id}" value="${n}"></label>`);
          }
          return `<div class="fq" data-q="${q.id}">${label}
            <div class="scale-row">${q.lo ? `<span class="end">${esc(q.lo)}</span>` : ''}${cells.join('')}${q.hi ? `<span class="end">${esc(q.hi)}</span>` : ''}</div></div>`;
        }
        const type = q.type === 'check' ? 'checkbox' : 'radio';
        return `<div class="fq" data-q="${q.id}">${label}${(q.options || []).map(o => `
          <label class="opt-row"><input type="${type}" name="${q.id}" value="${esc(o)}">${esc(o)}</label>`).join('')}
          ${q.other ? `<label class="opt-row"><input type="${type}" name="${q.id}" value="__other">Other:
            <input type="text" class="other-in" data-other="${q.id}" style="height:32px"></label>` : ''}</div>`;
      };

      body.innerHTML = `
        <h1>${esc(form.title)}</h1>
        ${form.description ? `<div class="form-desc">${rich(form.description)}</div>` : '<div style="margin-bottom:14px"></div>'}
        <div class="notice" id="notice"></div>
        <form id="the-form">
          ${signedIn ? '' : `
            <div class="fq"><label class="q-label">Your name <span style="opacity:.55; font-weight:400">(optional)</span></label>
              <div class="field" style="margin:0"><input id="f-name" maxlength="80"></div></div>`}
          ${qs.map(qHtml).join('')}
          <button class="btn" id="submit" type="submit" style="width:100%">Submit</button>
        </form>`;

      const notice = document.getElementById('notice');
      const say = (msg, cls) => {
        notice.textContent = msg; notice.className = `notice ${cls}`;
        notice.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      };

      document.getElementById('the-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const answers = {};
        const otherText = (qid) => {
          const t = body.querySelector(`[data-other="${qid}"]`)?.value.trim();
          return t ? `Other: ${t}` : 'Other';
        };
        for (const q of qs) {
          if (q.type === 'section') continue;
          let v = null;
          if (q.type === 'check') {
            v = [...body.querySelectorAll(`input[name="${q.id}"]:checked`)]
              .map(c => c.value === '__other' ? otherText(q.id) : c.value);
            if (!v.length) v = null;
          } else if (q.type === 'radio' || q.type === 'scale') {
            v = body.querySelector(`input[name="${q.id}"]:checked`)?.value ?? null;
            if (v === '__other') v = otherText(q.id);
            if (q.type === 'scale' && v != null) v = +v;
          } else {
            v = body.querySelector(`[data-in="${q.id}"]`)?.value.trim() || null;
          }
          if (q.required && (v == null || v === '')) {
            say(`Please answer: "${plain(q.label)}"`, 'error');
            return;
          }
          if (v != null) answers[q.id] = v;
        }
        const btn = document.getElementById('submit');
        btn.disabled = true; btn.textContent = 'Submitting…';
        if (!isPreview) {
          const { error: subErr } = await supabase.rpc('submit_form', {
            form: id,
            answers,
            submitter: signedIn ? null : (document.getElementById('f-name')?.value.trim() || null),
          });
          if (subErr) {
            say(subErr.message, 'error');
            btn.disabled = false; btn.textContent = 'Submit';
            return;
          }
        }
        body.innerHTML = `
          <div class="thanks">
            <div class="big">${isPreview ? '👁️' : '🎉'}</div>
            <h1>${isPreview ? 'Looks good!' : 'Response recorded!'}</h1>
            <p class="sub">${esc(form.settings?.confirm_msg || 'Cảm ơn bạn! Thanks for filling this out. 🌸')}</p>
            ${isPreview ? '<p class="sub" style="color:var(--ink-gold)">Preview only — nothing was saved. Close this tab to keep editing.</p>' : ''}
          </div>`;
      });
    }
  }
</script>
</body>
</html>
